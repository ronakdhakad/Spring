# ============================================================
# MailSense Configuration
# IMPORTANT: Do NOT commit this file with real credentials.
# ============================================================

# ---- DATABASE ----
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/mailsense_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
db.username=root
db.password=root@123

# ---- HIBERNATE ----
# Use 'update' for development, 'validate' for production
hibernate.hbm2ddl.auto=update
hibernate.show_sql=true

# ---- AES ENCRYPTION ----
# MUST be exactly 32 characters for AES-256
aes.secret.key=MailSense@SecretKey#2024#Change!

# ---- SCHEDULER ----
# Email sync interval in milliseconds (300000 = 5 minutes)
email.sync.interval.ms=300000
