# ==============================
# Database configuration
# ==============================
db.url=jdbc:mysql://localhost:3306/smart_email_analyzer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Change db.url, db.username, and db.password for your MySQL installation
# MySQL username
db.username=root
# MySQL password
db.password=root
# MySQL JDBC driver
db.driver=com.mysql.cj.jdbc.Driver

# ==============================
# Hibernate configuration
# ==============================
hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.show_sql=false
hibernate.format_sql=true
hibernate.hbm2ddl.auto=update
hibernate.jdbc.time_zone=UTC

# ==============================
# Mail / IMAP configuration
# ==============================
mail.imap.host=imap.gmail.com
mail.imap.port=993
mail.imap.protocol=imaps
mail.imap.folder=INBOX
mail.imap.connectionTimeout=10000
mail.imap.timeout=15000
mail.scheduler.fixedDelayMillis=300000
mail.initial.fetch.count=50

# Application-specific thresholds
app.urgent.threshold=70
